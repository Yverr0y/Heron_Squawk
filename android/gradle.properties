# Project-wide Gradle settings

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel builds
org.gradle.parallel=true

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Non-transitive R classes
android.nonTransitiveRClass=true

# Workaround for jlink/JdkImageTransform error
android.jdk.image.transformation.enabled=false
android.experimental.run-jlink-on-jdk-image=false
# Force Gradle to use the standard JDK instead of trying to generate a system image
android.experimental.jdk.image.transformation.enabled=false
